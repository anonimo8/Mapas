<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f2">
  <meta name="mapa-build" content="MAPA_PUBLICO_V3_2026-11-06_R2">
  <meta name="description" content="Busca territorios por número o dirección y consulta tu ubicación en el mapa de Lambayeque.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Mapa público de territorios | Lambayeque</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/style.css?v=20261106r2">
</head>
<body>
  <main class="public-map" aria-label="Mapa público de territorios de Lambayeque">
    <div id="map" role="application" aria-label="Mapa con divisiones numeradas; selecciona un territorio para obtener indicaciones"></div>

    <section class="search-panel" aria-label="Búsqueda del mapa">
      <div class="search-head"><span class="search-emblem" aria-hidden="true">⌖</span><div><b>Encuentra un territorio</b><small>Lambayeque · Mapa público</small></div></div>
      <form id="mapSearch" class="map-search" autocomplete="off">
        <label class="visually-hidden" for="searchType">Buscar por</label>
        <select id="searchType" aria-label="Tipo de búsqueda">
          <option value="territory">Territorio</option>
          <option value="address">Dirección</option>
        </select>
        <label class="visually-hidden" for="searchInput">Número de territorio o dirección</label>
        <input id="searchInput" name="q" type="search" inputmode="numeric" maxlength="120" placeholder="Ej. territorio 4" aria-describedby="searchStatus">
        <button class="search-submit" type="submit" aria-label="Buscar" title="Buscar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.4"/><path d="m16 16 5 5"/></svg>
        </button>
      </form>
      <p id="searchStatus" class="search-status" role="status" aria-live="polite" hidden></p>
      <div id="searchResults" class="search-results" aria-label="Resultados de la búsqueda" hidden></div>
    </section>

    <button id="locateButton" class="locate-button" type="button" title="Buscar mi ubicación por GPS" aria-label="Ver mi ubicación actual">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7.2"/><circle cx="12" cy="12" r="2.1"/><path d="M12 1.5v3.3M12 19.2v3.3M1.5 12h3.3M19.2 12h3.3"/></svg>
      <span>Mi ubicación</span>
    </button>

    <section id="destinationPanel" class="destination-panel" aria-label="Lugar seleccionado" hidden>
      <div class="destination-body"><span class="destination-kicker">DESTINO SELECCIONADO</span><strong id="destinationTitle"></strong><small id="destinationHint"></small></div>
      <div class="destination-actions"><button id="routeButton" type="button" class="route-button">Cómo llegar <span aria-hidden="true">↗</span></button><button id="clearDestination" type="button" class="clear-destination" aria-label="Quitar destino" title="Quitar destino">×</button></div>
    </section>

    <a class="admin-entry" href="/editar" title="Entrar a administración (acceso protegido)" aria-label="Administración de territorios">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span>Administración</span>
    </a>
    <div id="mapNotice" class="map-notice" role="status" aria-live="polite" hidden></div>
    <p class="privacy-footnote" title="Los recuentos menores de cinco personas se ocultan por privacidad">H/M por territorio · —: dato reservado</p>
  </main>
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script defer src="/territory-colors.js"></script>
  <script defer src="/app.js?v=20261106r2"></script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ec">
  <meta name="description" content="Mapa público de territorios de Lambayeque con divisiones numeradas y colores suaves.">
  <title>Mapa de territorios | Lambayeque</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="public-map" aria-label="Mapa público de territorios de Lambayeque">
    <div id="map" role="application" aria-label="Mapa con las divisiones y números de territorios"></div>
    <aside class="community-summary" role="status" aria-live="polite" aria-atomic="true" aria-label="Personas sordas registradas">
      <span class="summary-dot" aria-hidden="true"></span>
      <div class="summary-copy">
        <span class="summary-eyebrow">REGISTRO GENERAL</span>
        <span class="summary-number" id="deafCount">—</span>
        <span class="summary-label">personas sordas registradas</span>
      </div>
    </aside>
    <a class="admin-entry" href="/editar" title="Entrar a administración (acceso protegido)" aria-label="Administración de territorios">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      <span>Administración</span>
    </a>
    <div id="mapNotice" class="map-notice" role="status" hidden></div>
  </main>
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script defer src="/territory-colors.js"></script>
  <script defer src="/app.js"></script>
</body>
</html>
